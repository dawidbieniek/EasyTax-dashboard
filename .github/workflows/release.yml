name: Release

# A release is made when <Version> in Directory.Build.props is raised and the change reaches main. If a release for that version
# already exists, the run does nothing, so ordinary pushes to main are harmless. Details: docs/RELEASING.md

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = ($props.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          $tag = "v$version"
          $exists = git tag --list $tag
          if ($exists) {
            Write-Host "Release $tag already exists, nothing to do."
            "skip=true" >> $env:GITHUB_OUTPUT
          }
          else {
            "skip=false" >> $env:GITHUB_OUTPUT
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Set up .NET
        if: steps.version.outputs.skip == 'false'
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Import signing certificate
        if: steps.version.outputs.skip == 'false'
        id: certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SIGNING_CERTIFICATE_BASE64 }}
          PFX_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64 -or -not $env:PFX_PASSWORD) { throw 'Repository secrets SIGNING_CERTIFICATE_BASE64 and SIGNING_CERTIFICATE_PASSWORD are not set (see docs/RELEASING.md).' }
          $path = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX_BASE64))
          $certificate = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force)
          Remove-Item $path
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: Build signed package
        if: steps.version.outputs.skip == 'false'
        shell: pwsh
        run: ./tools/Build-Package.ps1 -Thumbprint "${{ steps.certificate.outputs.thumbprint }}" -Repository "${{ github.repository }}"

      - name: Create release
        if: steps.version.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: EasyTax Dashboard ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/release/EasyTaxDashboard.msix
            artifacts/release/EasyTaxDashboard.appinstaller
            artifacts/release/EasyTaxDashboard.cer
            artifacts/release/Install-Certificate.ps1
